name: Deploy to GitHub Pages

on:
  workflow_dispatch:

# One-time import on the review branch only. The normal Pages workflow is
# restored through the GitHub UI before this branch is merged.
permissions:
  contents: read

jobs:
  import-reviewed-originals:
    if: github.repository == 'Runtheworldbetter/motion-atlas-studio' && github.ref == 'refs/heads/atlas-upstream-originals-060'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Import the exact reviewed source archive
        env:
          SOURCE_SHA256: 48418fab6d247aab8dc577e07951edb17cef2e00c0e9a6b3c4bc857c361647a7
        run: |
          python3 - <<'PYCODE'
          import hashlib, io, json, os, pathlib, stat, zipfile
          source = pathlib.Path('release-source-0.6.0.zip')
          data = source.read_bytes()
          assert hashlib.sha256(data).hexdigest() == os.environ['SOURCE_SHA256'], 'Source checksum mismatch'
          root = pathlib.Path.cwd().resolve()
          allowed = {'src', 'lib', 'scripts', 'tests', 'docs', 'public', '.github', 'package.json', 'package-lock.json', 'vite.config.ts', 'tsconfig.json', 'index.html', 'README.md', 'LICENSE', 'CONTRIBUTING.md', '.gitignore'}
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.testzip() is None
              assert json.loads(archive.read('package.json'))['version'] == '0.6.0'
              for entry in archive.infolist():
                  path = pathlib.PurePosixPath(entry.filename)
                  assert not path.is_absolute() and path.parts[0] in allowed
                  assert not any(part in {'..', '.git', '.openai', 'node_modules', '.env'} for part in path.parts)
                  assert not stat.S_ISLNK(entry.external_attr >> 16)
                  destination = root.joinpath(*path.parts)
                  assert destination.resolve().is_relative_to(root)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(entry))
          source.unlink()
          PYCODE
          # Workflow restoration is a separate visible UI edit, not a token write.
          git restore --source=HEAD -- .github/workflows
      - name: Validate the imported release
        run: |
          npm ci
          npm test
          npm run typecheck
          node scripts/generate-notices.mjs --check
          npm run build
      - name: Commit the reviewed application source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src lib scripts tests docs public package.json package-lock.json vite.config.ts tsconfig.json index.html README.md LICENSE CONTRIBUTING.md .gitignore release-source-0.6.0.zip
          git commit -m 'Add six licensed originals and source exports for Atlas 0.6.0'
          git push origin HEAD:atlas-upstream-originals-060
